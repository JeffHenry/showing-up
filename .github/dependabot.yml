version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Batch routine updates so the week brings a couple of PRs instead of dozens.
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Deliberate version pins; see docs/adr/0001-stack-and-versions.md before lifting any of these.
    ignore:
      # typescript-eslint supports TypeScript <6.1, so even a minor bump would break linting.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # eslint-plugin-jsx-a11y supports ESLint <=9.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # Node type definitions must match the Node runtime major (.nvmrc / engines / Vercel), not the
      # newest Node release; bump together with the runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Vitest 5's mocker declares msw@^2.
      - dependency-name: msw
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
